<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2c2f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>SICTOM — Conventions MAD (démo)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">S</div>
        <div>
          <h1>SICTOM</h1>
          <p>Conventions de mise à disposition de conteneurs</p>
        </div>
      </div>
      <form id="login-form">
        <label>Email
          <input type="email" id="login-email" required autocomplete="username" placeholder="prenom@sictom.fr" />
        </label>
        <label>Mot de passe
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" />
        </label>
        <div id="login-error" class="form-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>
      <div class="demo-accounts">
        <p>Comptes de démonstration :</p>
        <button type="button" data-demo="admin@sictom.fr|admin123">🛡️ Administrateur</button>
        <button type="button" data-demo="prep@sictom.fr|prep123">📋 Préparateur</button>
        <button type="button" data-demo="commune@saint-martin.fr|commune123">🏛️ Commune</button>
        <button type="button" data-demo="usager@boyer.fr|usager123">👤 Usager</button>
      </div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="btn-menu" class="icon-btn hidden-desktop">☰</button>
      <div class="topbar-brand">
        <span class="brand-mark small">S</span>
        <strong>SICTOM</strong><span class="muted">· Conventions MAD</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-install" class="btn btn-ghost hidden">⬇️ Installer</button>
        <div class="user-chip" id="user-chip"></div>
        <button id="btn-logout" class="icon-btn" title="Déconnexion">⎋</button>
      </div>
    </header>
    <div class="layout">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="main" id="main"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="lib/xlsx.full.min.js"></script>
  <script src="lib/pdf-lib.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
